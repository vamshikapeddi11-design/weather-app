<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .main{
      display:flex;
      height:100vh;
    }

    /* SIDEBAR */

    .sidebar{
      width:220px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      padding:30px 20px;
      border-right:1px solid rgba(255,255,255,0.1);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      margin-bottom:40px;
      color:#38bdf8;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .menu-item{
      padding:14px;
      border-radius:14px;
      cursor:pointer;
      transition:0.3s;
      font-size:18px;
      background:rgba(255,255,255,0.06);
    }

    .menu-item:hover{
      background:rgba(56,189,248,0.25);
    }

    .active{
      background:#38bdf8;
    }

    /* CONTENT */

    .content{
      flex:1;
      padding:25px 40px;
      overflow-y:auto;
    }

    /* HOME SECTION */

    #homeSection{
      display:block;
      height:100%;
    }

    .top-bar{
      display:flex;
      justify-content:flex-end;
      margin-bottom:0;
    }

    .right{
      text-align:right;
    }

    .date{
      font-size:24px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .time{
      font-size:50px;
      font-weight:bold;
      color:#38bdf8;
    }

    .weather-content{
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      margin-top:0;
      padding-top:0;
      padding-bottom:10px;
    }

    .city{
      font-size:48px;
      font-weight:bold;
      margin-top:0;
    }

    .icon{
      font-size:90px;
      margin:12px 0;
    }

    .temp{
      font-size:72px;
      font-weight:bold;
    }

    .condition{
      font-size:26px;
      color:#cbd5e1;
      margin-top:8px;
    }

    /* INFO */

    .info-row{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
      margin-top:30px;
      width:100%;
    }

    .info-box{
      background:rgba(255,255,255,0.1);
      padding:18px;
      border-radius:20px;
      backdrop-filter:blur(10px);
      font-size:18px;
      transition:0.3s;
      text-align:center;
    }

    .info-box:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.15);
    }

    /* FORECAST */

    #forecastSection{
      display:none;
    }

    .forecast-title{
      font-size:32px;
      margin-bottom:25px;
      font-weight:bold;
    }

    /* HOURLY */

    .hourly{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:20px;
      width:100%;
    }

    .hour-card{
      background:rgba(255,255,255,0.1);
      padding:25px;
      border-radius:22px;
      text-align:center;
      backdrop-filter:blur(10px);
      min-height:220px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      transition:0.3s;
    }

    .hour-card:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.15);
    }

    .hour-time{
      font-size:20px;
      margin-bottom:15px;
      color:#cbd5e1;
    }

    .hour-icon{
      font-size:50px;
      margin-bottom:15px;
    }

    .hour-temp{
      font-size:28px;
      font-weight:bold;
    }

    /* WEEKLY */

    .weekly{
      display:none;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      width:100%;
    }

    .week-card{
      background:rgba(255,255,255,0.1);
      padding:25px;
      border-radius:22px;
      text-align:center;
      backdrop-filter:blur(10px);

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      min-height:220px;

      transition:0.3s;
    }

    .week-card:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.15);
    }

    .day{
      font-size:24px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .week-temp{
      font-size:26px;
      margin-top:15px;
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="main">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="logo">
      🌤 Weather
    </div>

    <div class="menu">

      <div
        class="menu-item active"
        id="homeBtn"
        onclick="showHome()"
      >
        🏠 Home
      </div>

      <div
        class="menu-item"
        id="hourlyBtn"
        onclick="showHourly()"
      >
        ⏰ Hourly Forecast
      </div>

      <div
        class="menu-item"
        id="weeklyBtn"
        onclick="showWeekly()"
      >
        📅 Weekly Forecast
      </div>

    </div>

  </div>

  <!-- CONTENT -->

  <div class="content">

    <!-- HOME -->

    <div id="homeSection">

      <!-- TOP RIGHT DATE -->

      <div class="top-bar">

        <div class="right">

          <div class="date" id="date">
            ---
          </div>

          <div class="time" id="time">
            --
          </div>

        </div>

      </div>

      <!-- WEATHER -->

      <div class="weather-content">

        <div class="city" id="city">
          Loading...
        </div>

        <div class="icon" id="icon">
          ☀️
        </div>

        <div class="temp" id="temp">
          --°C
        </div>

        <div class="condition" id="condition">
          ---
        </div>

        <!-- INFO BOXES -->

        <div class="info-row">

          <div class="info-box" id="wind">
            💨 Wind: --
          </div>

          <div class="info-box" id="precip">
            🌧 Precip: --
          </div>

          <div class="info-box" id="humidity">
            💧 Humidity: --
          </div>

          <div class="info-box" id="feels">
            🌡 Feels Like: --
          </div>

        </div>

      </div>

    </div>

    <!-- FORECAST -->

    <div id="forecastSection">

      <div class="forecast-title" id="forecastTitle">
        Hourly Forecast
      </div>

      <!-- HOURLY -->

      <div class="hourly" id="hourly"></div>

      <!-- WEEKLY -->

      <div class="weekly" id="weekly"></div>

    </div>

  </div>

</div>

<script>

  const params =
  new URLSearchParams(window.location.search);

  const city =
  params.get("city")?.trim();

  const countryInput =
  params.get("country")?.trim();

  // ICONS

  function getIcon(code){

    if(code === 0) return "☀️";

    if(code <= 3) return "⛅";

    if(code <= 48) return "🌫";

    if(code <= 67) return "🌧";

    if(code <= 77) return "❄️";

    if(code <= 99) return "⛈";

    return "🌈";
  }

  // WEATHER TEXT

  function getText(code){

    if(code === 0) return "Clear Sky";

    if(code <= 3) return "Partly Cloudy";

    if(code <= 48) return "Foggy";

    if(code <= 67) return "Rainy";

    if(code <= 77) return "Snow";

    if(code <= 99) return "Thunderstorm";

    return "Unknown";
  }

  // FORMAT TIME

  function formatTime(timeStr){

    const date =
    new Date(timeStr);

    let hours =
    date.getHours();

    const ampm =
    hours >= 12 ? "PM" : "AM";

    hours =
    hours % 12 || 12;

    return hours + " " + ampm;
  }

  // DATE & TIME

  function updateDateTime(){

    const now =
    new Date();

    document.getElementById("date").innerText =
    now.toDateString();

    document.getElementById("time").innerText =
    now.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  setInterval(updateDateTime,1000);

  updateDateTime();

  // MENU

  function clearActive(){

    document.getElementById("homeBtn").classList.remove("active");

    document.getElementById("hourlyBtn").classList.remove("active");

    document.getElementById("weeklyBtn").classList.remove("active");
  }

  function showHome(){

    clearActive();

    document.getElementById("homeBtn").classList.add("active");

    document.getElementById("homeSection").style.display =
    "block";

    document.getElementById("forecastSection").style.display =
    "none";
  }

  function showHourly(){

    clearActive();

    document.getElementById("hourlyBtn").classList.add("active");

    document.getElementById("homeSection").style.display =
    "none";

    document.getElementById("forecastSection").style.display =
    "block";

    document.getElementById("forecastTitle").innerText =
    "Hourly Forecast";

    document.getElementById("hourly").style.display =
    "grid";

    document.getElementById("weekly").style.display =
    "none";
  }

  function showWeekly(){

    clearActive();

    document.getElementById("weeklyBtn").classList.add("active");

    document.getElementById("homeSection").style.display =
    "none";

    document.getElementById("forecastSection").style.display =
    "block";

    document.getElementById("forecastTitle").innerText =
    "Weekly Forecast";

    document.getElementById("hourly").style.display =
    "none";

    document.getElementById("weekly").style.display =
    "grid";
  }

  // MAIN WEATHER FUNCTION

  async function getWeather(){

    try{

      const geoUrl =
      `https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=10&language=en&format=json`;

      const geoRes =
      await fetch(geoUrl);

      const geoData =
      await geoRes.json();

      let place =
      geoData.results.find(
        item =>
        item.country.toLowerCase() ===
        countryInput.toLowerCase()
      ) || geoData.results[0];

      const lat =
      place.latitude;

      const lon =
      place.longitude;

      const weatherUrl =
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,precipitation_probability,weathercode,relativehumidity_2m,apparent_temperature&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=auto`;

      const res =
      await fetch(weatherUrl);

      const data =
      await res.json();

      const w =
      data.current_weather;

      document.getElementById("city").innerText =
      city + ", " + countryInput;

      document.getElementById("icon").innerText =
      getIcon(w.weathercode);

      document.getElementById("temp").innerText =
      w.temperature + "°C";

      document.getElementById("condition").innerText =
      getText(w.weathercode);

      const currentHour =
      new Date().getHours();

      document.getElementById("wind").innerText =
      "💨 Wind: " + w.windspeed + " km/h";

      document.getElementById("precip").innerText =
      "🌧 Precip: " +
      data.hourly.precipitation_probability[currentHour] + "%";

      document.getElementById("humidity").innerText =
      "💧 Humidity: " +
      data.hourly.relativehumidity_2m[currentHour] + "%";

      document.getElementById("feels").innerText =
      "🌡 Feels Like: " +
      data.hourly.apparent_temperature[currentHour] + "°C";

      // HOURLY

      const hourlyDiv =
      document.getElementById("hourly");

      hourlyDiv.innerHTML = "";

      for(let i=0;i<12;i++){

        let index =
        currentHour + i;

        const div =
        document.createElement("div");

        div.className =
        "hour-card";

        div.innerHTML = `
          <div class="hour-time">
            ${formatTime(data.hourly.time[index])}
          </div>

          <div class="hour-icon">
            ${getIcon(data.hourly.weathercode[index])}
          </div>

          <div class="hour-temp">
            ${data.hourly.temperature_2m[index]}°
          </div>
        `;

        hourlyDiv.appendChild(div);
      }

      // WEEKLY

      const weeklyDiv =
      document.getElementById("weekly");

      weeklyDiv.innerHTML = "";

      for(let i=0;i<7;i++){

        const date =
        new Date(data.daily.time[i]);

        const day =
        date.toLocaleDateString("en-US",{
          weekday:"long"
        });

        const div =
        document.createElement("div");

        div.className =
        "week-card";

        div.innerHTML = `
          <div class="day">
            ${day}
          </div>

          <div class="hour-icon">
            ${getIcon(data.daily.weathercode[i])}
          </div>

          <div class="week-temp">
            ${data.daily.temperature_2m_max[i]}°
            /
            ${data.daily.temperature_2m_min[i]}°
          </div>
        `;

        weeklyDiv.appendChild(div);
      }

    }

    catch(error){

      document.getElementById("city").innerText =
      "Error loading data";
    }
  }

  getWeather();

</script>

</body>
</html>
