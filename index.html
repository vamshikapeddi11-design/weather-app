<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>

  <style>

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      width: 320px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    h1 {
      color: white;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      margin-bottom: 15px;
      font-size: 14px;
    }

    button {
      width: 95%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0ea5e9;
    }

  </style>
</head>

<body>

  <div class="weather-card">

    <h1>🌤 Weather App</h1>

    <p>
      Enter city and country
    </p>

    <!-- CITY INPUT -->

    <input
      type="text"
      id="cityInput"
      placeholder="Enter city..."
    >

    <!-- COUNTRY INPUT -->

    <input
      type="text"
      id="countryInput"
      placeholder="Enter country..."
    >

    <!-- SEARCH BUTTON -->

    <button onclick="searchWeather()">
      Search
    </button>

  </div>

  <script>

    function searchWeather() {

      let city =
      document.getElementById("cityInput").value.trim();

      let country =
      document.getElementById("countryInput").value.trim();

      if(city === "" || country === ""){

        alert("Please enter city and country");

        return;
      }

      // SEND BOTH VALUES

      window.location.href =
      `weather.html?city=${city}&country=${country}`;
    }

  </script>

</body>
</html>
